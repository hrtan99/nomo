services:
  dev: &etas-service
    environment:
      NOMO_NORMAL_GRAPH: "${NOMO_ETAS_GRAPH:-latest0121}"
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /home/nomo/.cargo/etas-latest/target
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
  dependency: *etas-service
volumes:
  cargo-cache:
    name: "nomo-cargo-0121-20261111-a3c49ffb"
