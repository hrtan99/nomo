services:
  dev: &etas-service
    environment:
      NOMO_NORMAL_GRAPH: latest025
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /home/nomo/.cargo/etas-025/target
      PYTHONDONTWRITEBYTECODE: "1"
