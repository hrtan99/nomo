# Provision this directory exclusively before use. Never let Compose create it.
# Combine with config/model-tool-compose.yaml for the immutable synthetic files.
services:
  dev:
    working_dir: /state
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: cargo-cache
        target: /home/nomo/.cargo
        read_only: true
      - type: bind
        source: "${NOMO_HARNESS_CHECKPOINT_DIR:?explicit fresh owned directory required}"
        target: /state
        bind:
          create_host_path: false
