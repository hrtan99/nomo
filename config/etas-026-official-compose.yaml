services:
  dev:
    environment:
      NOMO_NORMAL_GRAPH: "${NOMO_ETAS_GRAPH:-026-20261103-a}"
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /home/nomo/.cargo/etas-026/target
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
  dependency:
    environment:
      NOMO_NORMAL_GRAPH: "${NOMO_ETAS_GRAPH:-026-20261103-a}"
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /home/nomo/.cargo/etas-026/target
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
volumes:
  cargo-cache:
    name: "nomo-cargo-${NOMO_ETAS_GRAPH:-026-20261103-a}"
