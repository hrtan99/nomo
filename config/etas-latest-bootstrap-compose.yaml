x-latest-build: &latest-build
  environment:
    CARGO_BUILD_JOBS: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: volume
      source: cargo-cache
      target: /home/nomo/.cargo
services:
  dev:
    <<: *latest-build
  dependency:
    <<: *latest-build
