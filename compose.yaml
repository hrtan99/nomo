name: nomo

x-nomo-common: &nomo-common
  build:
    context: .
    dockerfile: Dockerfile
  image: nomo-dev:ubuntu-26.04-arm64
  platform: linux/arm64
  init: true
  user: "10001:10001"
  working_dir: /workspace
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  cpus: 4.0
  mem_limit: 4g
  memswap_limit: 4g
  stop_grace_period: 10s
  environment:
    CARGO_HOME: /home/nomo/.cargo
    CARGO_TARGET_DIR: /home/nomo/.cargo/etas-latest/target
    NOMO_NORMAL_GRAPH: latest
    HISTFILE: /tmp/.bash_history
    HOME: /home/nomo
  volumes:
    - type: bind
      source: .
      target: /workspace
    - type: volume
      source: cargo-cache
      target: /home/nomo/.cargo
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    - /home/nomo/.cache:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001,mode=0700

services:
  dev:
    <<: *nomo-common
    network_mode: none
    stdin_open: true
    tty: true

  dependency:
    <<: *nomo-common
    profiles:
      - networked
    network_mode: bridge
    stdin_open: true
    tty: true

  model-gateway:
    <<: *nomo-common
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: nomo-omlx-gateway:0.1.0
    profiles:
      - model-integration
    working_dir: /tmp
    networks:
      - model-internal
      - model-upstream
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: []
    secrets:
      - source: omlx_api_key
        target: omlx_api_key
      - source: gateway_client_token
        target: gateway_client_token
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  model-integration:
    <<: *nomo-common
    profiles:
      - model-integration
    networks:
      - model-internal
    depends_on:
      model-gateway:
        condition: service_healthy
    environment:
      CARGO_HOME: /home/nomo/.cargo
      CARGO_TARGET_DIR: /home/nomo/.cargo/etas-latest/target
      NOMO_NORMAL_GRAPH: latest
      HISTFILE: /tmp/.bash_history
      HOME: /home/nomo
      NOMO_GATEWAY_CLIENT_TOKEN: "${NOMO_GATEWAY_CLIENT_TOKEN:-}"

volumes:
  cargo-cache:
    name: nomo-cargo-cache-latest-002-20261024

networks:
  model-internal:
    name: nomo-model-internal
    internal: true
  model-upstream:
    name: nomo-model-upstream

secrets:
  omlx_api_key:
    file: "${NOMO_OMLX_API_KEY_FILE:-/dev/null}"
  gateway_client_token:
    file: "${NOMO_GATEWAY_CLIENT_TOKEN_FILE:-/dev/null}"
