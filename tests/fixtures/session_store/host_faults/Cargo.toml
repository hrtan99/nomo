etas_frontend = { git = "https://github.com/etas-project/etas-frontend.git", rev = "59b2115de2ca7c33b5c5743f4113fa51eb3eb69e" }
etas_interpreter = { git = "https://github.com/etas-project/etas-interpreter.git", rev = "481ff62c895978853bc7385d76c1a799a5f780b1" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
