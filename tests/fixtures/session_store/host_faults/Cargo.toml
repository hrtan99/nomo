[package]
name = "nomo-session-store-host-faults"
version = "0.1.0"
edition = "2024"
publish = false

# Build only with the SESSION-STORE-GRAPH-001 retained local path overrides.
# These are the reviewed source pins, not the normal application's dependencies.
[dependencies]
etas_core = { git = "https://github.com/etas-project/etas-core.git", rev = "375a6a088eca4df2d0accf4d8c9550901721b1e3" }
