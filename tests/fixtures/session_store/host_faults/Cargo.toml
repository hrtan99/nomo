[package]
name = "nomo-session-store-host-faults"
version = "0.1.0"
edition = "2024"
publish = false

# Build with the adopted ETAS-0013 graph's verified local path overrides.
# This test-only host uses the same reviewed pins as the normal application.
[dependencies]
etas_core = { git = "https://github.com/etas-project/etas-core.git", rev = "198c362a937139b50c4484ae2cf7a4819a9df714" }
etas_host = { git = "https://github.com/etas-project/etas-core.git", rev = "198c362a937139b50c4484ae2cf7a4819a9df714" }
etas_frontend = { git = "https://github.com/etas-project/etas-frontend.git", rev = "7b1974b95c64e7833779ee1eda5ec73c4374b4fe" }
etas_interpreter = { git = "https://github.com/etas-project/etas-interpreter.git", rev = "d8e7ecaf8f5a234dea48ef887a20d829ccdc401e" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
