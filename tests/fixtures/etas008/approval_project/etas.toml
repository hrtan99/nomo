[package]
name = "etas008-terminal-approval"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "prompt"

[runtime.profiles.prompt]
boundary_policy = "etas008-approval"

[runtime.profiles.prompt.policy]
mode = "local-static"
rules = ["console=approval"]

[runtime.profiles.prompt.approval]
mode = "prompt"

[[bin]]
name = "terminal-approval"
module = "app.main"
flow = "main"
profile = "prompt"
