[package]
name = "etas005-command-project"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "command"

[runtime.profiles.command]
boundary_policy = "etas005-command"

[runtime.profiles.command.command]
allow = ["/bin/sh", "/usr/bin/python3"]

[runtime.profiles.command.policy]
mode = "local-static"
rules = ["command=allow"]

[[bin]]
name = "command-probe"
module = "app.main"
flow = "main"
profile = "command"
