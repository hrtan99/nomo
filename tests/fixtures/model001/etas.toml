[package]
name = "nomo-model-test"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "mock"

[runtime.profiles.mock]
boundary_policy = "nomo-model-test"

[runtime.profiles.mock.model]
adapter = "omlx-openai"
model = "Qwen3.5-9B-MLX-4bit"
base_url = "http://127.0.0.1:18848/v1"
api_key_env = "ETAS003_TEST_API_KEY"
enable_thinking = false

[runtime.profiles.mock.model.timeout]
request_deadline_ms = 500
connect_timeout_ms = 200

[runtime.profiles.mock.model.retry]
attempts = 1
delay_ms = 0

[runtime.profiles.mock.policy]
mode = "local-static"
rules = ["console=allow", "model=allow"]

[runtime.profiles.mock.approval]
mode = "deny"

[[bin]]
name = "probe"
module = "nomo.main"
flow = "main"
profile = "mock"
