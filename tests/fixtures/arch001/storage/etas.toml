[package]
name = "arch001-storage-spike"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime.profiles.allowed]
boundary_policy = "arch001"

[runtime.profiles.allowed.policy]
mode = "local-static"
rules = ["memory=allow", "console=allow", "command=allow"]

[runtime.profiles.allowed.command]
allow = ["/bin/sh"]

[runtime.profiles.denied]
boundary_policy = "arch001"

[runtime.profiles.denied.policy]
mode = "local-static"
rules = ["memory=deny", "console=allow", "command=allow"]

[runtime.profiles.denied.command]
allow = ["/bin/sh"]

[[bin]]
name = "storage"
module = "app.main"
flow = "main"
profile = "allowed"
