[package]
name = "etas003-model-project"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "mock-success"

[runtime.profiles.mock-success]
boundary_policy = "etas003-model"

[runtime.profiles.mock-success.model]
adapter = "omlx-openai"
model = "mock-success"
base_url = "http://127.0.0.1:18848/v1"
api_key_env = "ETAS003_TEST_API_KEY"
enable_thinking = false

[runtime.profiles.mock-success.model.timeout]
request_deadline_ms = 3000
connect_timeout_ms = 500

[runtime.profiles.mock-success.model.retry]
attempts = 1
delay_ms = 0

[runtime.profiles.mock-success.policy]
mode = "local-static"
rules = ["model=allow"]

[runtime.profiles.mock-unauthorized]
boundary_policy = "etas003-model"

[runtime.profiles.mock-unauthorized.model]
adapter = "omlx-openai"
