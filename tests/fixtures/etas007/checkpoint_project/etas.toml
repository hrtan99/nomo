[package]
name = "etas007-checkpoint-session"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "checkpoint"

[runtime.profiles.checkpoint]
boundary_policy = "etas007-checkpoint"

[runtime.profiles.checkpoint.policy]
mode = "local-static"
rules = ["console=allow"]

[runtime.profiles.checkpoint.approval]
mode = "deny"

[[bin]]
name = "checkpoint-session"
module = "app.main"
flow = "main"
profile = "checkpoint"
