delay_ms = 0

[runtime.profiles.gateway-qwen-readonly.filesystem.regions."nomo.tools.workspace.ReadOnlyRoot"]
root = "/model-tool-fixture"
read = true
write = false

[runtime.profiles.gateway-qwen-readonly.policy]
mode = "local-static"
rules = ["console=allow", "model=allow", "filesystem=allow"]

[runtime.profiles.gateway-qwen-readonly.approval]
mode = "deny"

