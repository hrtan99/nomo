[package]
name = "nomo"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "foundation"

[runtime.profiles.foundation]
boundary_policy = "nomo-foundation"

[runtime.profiles.foundation.policy]
mode = "local-static"
rules = ["console=allow"]

[runtime.profiles.foundation.approval]
mode = "deny"

[runtime.profiles.gateway-qwen]
boundary_policy = "nomo-model-text"

[runtime.profiles.gateway-qwen.model]
adapter = "omlx-openai"
model = "Qwen3.5-9B-MLX-4bit"
base_url = "http://model-gateway:8080/v1"
api_key_env = "NOMO_GATEWAY_CLIENT_TOKEN"
allow_private = true
enable_thinking = false

[runtime.profiles.gateway-qwen.model.timeout]
request_deadline_ms = 120000
connect_timeout_ms = 2000

[runtime.profiles.gateway-qwen.model.retry]
attempts = 1
delay_ms = 0

[runtime.profiles.gateway-qwen.policy]
mode = "local-static"
rules = ["console=allow", "model=allow"]

[runtime.profiles.gateway-qwen.approval]
mode = "deny"

[runtime.profiles.gateway-qwen-readonly]
boundary_policy = "nomo-model-readonly"

[runtime.profiles.gateway-qwen-readonly.model]
adapter = "omlx-openai"
model = "Qwen3.5-9B-MLX-4bit"
base_url = "http://model-gateway:8080/v1"
api_key_env = "NOMO_GATEWAY_CLIENT_TOKEN"
allow_private = true
enable_thinking = false

[runtime.profiles.gateway-qwen-readonly.model.timeout]
request_deadline_ms = 120000
connect_timeout_ms = 2000

[runtime.profiles.gateway-qwen-readonly.model.retry]
attempts = 1
delay_ms = 0

[runtime.profiles.gateway-qwen-readonly.filesystem.regions."nomo.tools.workspace.ReadOnlyRoot"]
root = "/model-tool-fixture"
read = true
write = false

[runtime.profiles.gateway-qwen-readonly.policy]
mode = "local-static"
rules = ["console=allow", "model=allow", "filesystem=allow"]

[runtime.profiles.gateway-qwen-readonly.approval]
mode = "deny"

[runtime.profiles.session-demo-create]
boundary_policy = "nomo-session-demo"

[runtime.profiles.session-demo-create.memory]
backend = "sqlite"
path = "memory.sqlite3"

[runtime.profiles.session-demo-create.session]
backend = "sqlite"
path = "session.sqlite3"

[runtime.profiles.session-demo-create.policy]
mode = "local-static"
rules = ["console=allow", "memory=allow", "session=allow"]

[runtime.profiles.session-demo-create.approval]
mode = "deny"

[runtime.profiles.session-demo-existing]
boundary_policy = "nomo-session-demo"

[runtime.profiles.session-demo-existing.memory]
backend = "sqlite"
path = "file:memory.sqlite3?mode=rw"

[runtime.profiles.session-demo-existing.session]
backend = "sqlite"
path = "file:session.sqlite3?mode=rw"

[runtime.profiles.session-demo-existing.policy]
mode = "local-static"
rules = ["console=allow", "memory=allow", "session=allow"]

[runtime.profiles.session-demo-existing.approval]
mode = "deny"

[runtime.profiles.harness-checkpoint-create]
boundary_policy = "nomo-harness-checkpoint"

[runtime.profiles.harness-checkpoint-create.memory]
backend = "sqlite"
path = "harness.sqlite3"

[runtime.profiles.harness-checkpoint-create.policy]
mode = "local-static"
rules = ["console=allow", "memory=allow"]

[runtime.profiles.harness-checkpoint-create.approval]
mode = "deny"

[runtime.profiles.harness-checkpoint-save]
boundary_policy = "nomo-harness-checkpoint"

[runtime.profiles.harness-checkpoint-save.memory]
backend = "sqlite"
path = "file:harness.sqlite3?mode=rw"

[runtime.profiles.harness-checkpoint-save.model]
adapter = "omlx-openai"
model = "Qwen3.5-9B-MLX-4bit"
base_url = "http://model-gateway:8080/v1"
api_key_env = "NOMO_GATEWAY_CLIENT_TOKEN"
allow_private = true
enable_thinking = false

[runtime.profiles.harness-checkpoint-save.model.timeout]
request_deadline_ms = 120000
connect_timeout_ms = 2000

[runtime.profiles.harness-checkpoint-save.model.retry]
attempts = 1
delay_ms = 0

[runtime.profiles.harness-checkpoint-save.filesystem.regions."nomo.tools.workspace.ReadOnlyRoot"]
root = "/model-tool-fixture"
read = true
write = false

[runtime.profiles.harness-checkpoint-save.policy]
mode = "local-static"
rules = ["console=allow", "memory=allow", "model=allow", "filesystem=allow"]

[runtime.profiles.harness-checkpoint-save.approval]
mode = "deny"

[runtime.profiles.harness-checkpoint-show]
boundary_policy = "nomo-harness-checkpoint"

[runtime.profiles.harness-checkpoint-show.memory]
backend = "sqlite"
path = "file:harness.sqlite3?mode=rw"

[runtime.profiles.harness-checkpoint-show.policy]
mode = "local-static"
rules = ["console=allow", "memory=allow"]

[runtime.profiles.harness-checkpoint-show.approval]
mode = "deny"

[[bin]]
name = "nomo"
module = "nomo.main"
flow = "main"
profile = "foundation"

[[bin]]
name = "nomo-session-init"
module = "nomo.main"
flow = "init"
profile = "harness-checkpoint-create"

[[bin]]
name = "nomo-session-new"
module = "nomo.main"
flow = "new"
profile = "harness-checkpoint-save"

[[bin]]
name = "nomo-session-resume"
module = "nomo.main"
flow = "resume"
profile = "harness-checkpoint-save"

[[bin]]
name = "nomo-session-show"
module = "nomo.main"
flow = "show"
profile = "harness-checkpoint-show"

[[bin]]
name = "nomo-session-help"
module = "nomo.main"
flow = "help"
profile = "foundation"
