[package]
name = "nomo"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "foundation"

[runtime.profiles.foundation]
boundary_policy = "nomo-foundation"

[runtime.profiles.foundation.policy]
mode = "local-static"
rules = ["console=allow"]

[runtime.profiles.foundation.approval]
mode = "deny"

[[bin]]
name = "nomo"
module = "nomo.main"
flow = "main"
profile = "foundation"
