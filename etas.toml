[package]
name = "nomo"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "foundation"

[runtime.profiles.foundation]
boundary_policy = "nomo-foundation"

[runtime.profiles.foundation.policy]
mode = "local-static"
rules = ["console=allow"]

[runtime.profiles.foundation.approval]
mode = "deny"

[runtime.profiles.gateway-qwen]
boundary_policy = "nomo-model-text"

[runtime.profiles.gateway-qwen.model]
adapter = "omlx-openai"
model = "Qwen3.5-9B-MLX-4bit"
base_url = "http://model-gateway:8080/v1"
api_key_env = "NOMO_GATEWAY_CLIENT_TOKEN"
allow_private = true
enable_thinking = false

[runtime.profiles.gateway-qwen.model.timeout]
request_deadline_ms = 120000
connect_timeout_ms = 2000

[runtime.profiles.gateway-qwen.model.retry]
attempts = 1
delay_ms = 0

[runtime.profiles.gateway-qwen.policy]
mode = "local-static"
rules = ["console=allow", "model=allow"]

[runtime.profiles.gateway-qwen.approval]
mode = "deny"

[runtime.profiles.gateway-qwen-readonly]
boundary_policy = "nomo-model-readonly"

[runtime.profiles.gateway-qwen-readonly.model]
adapter = "omlx-openai"
model = "Qwen3.5-9B-MLX-4bit"
