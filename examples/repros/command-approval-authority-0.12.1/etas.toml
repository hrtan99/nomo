[package]
name = "command-approval-authority"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "local"

[runtime.profiles.local.filesystem.regions."app.main.ProjectRoot"]
root = "/tmp"
read = true
write = false

[runtime.profiles.local.command]
allow = ["/bin/echo"]
isolation = "trusted-unconfined"

[runtime.profiles.local.policy]
mode = "local-static"
rules = ["command=approval", "approval=allow"]

[runtime.profiles.local.approval]
mode = "prompt"

[[bin]]
name = "command-approval-authority"
module = "app.main"
flow = "main"
