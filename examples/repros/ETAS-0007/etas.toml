[package]
name = "command-reachability-repro"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "command"

[runtime.profiles.command]
boundary_policy = "command-reachability-repro"

[runtime.profiles.command.command]
allow = ["/bin/sh"]

[runtime.profiles.command.policy]
mode = "local-static"
rules = ["command=allow"]

[[bin]]
name = "command-reachability-repro"
module = "app.main"
flow = "main"
profile = "command"
