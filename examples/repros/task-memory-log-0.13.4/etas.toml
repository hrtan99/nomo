[package]
name = "task-memory-log"
version = "0.1.0"
edition = "2026"
[source]
root = "src"
[runtime]
default_profile = "local"
[runtime.profiles.local.memory]
backend = "sqlite"
path = "/probe-state/memory.sqlite3"
[runtime.profiles.local.policy]
mode = "local-static"
rules = ["console=allow", "memory=allow"]
[[bin]]
name = "task-memory-log"
module = "app.main"
flow = "main"
