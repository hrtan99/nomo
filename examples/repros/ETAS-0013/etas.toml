[package]
name = "memory-match-repro"
version = "0.0.0"
edition = "2026"

[source]
root = "src"

[runtime]
default_profile = "fixture"

[runtime.profiles.fixture]
boundary_policy = "memory-match-repro"

[runtime.profiles.fixture.policy]
mode = "local-static"
rules = ["console=allow"]

[runtime.profiles.fixture.approval]
mode = "deny"

[[bin]]
name = "probe"
module = "app.main"
flow = "main"
profile = "fixture"
