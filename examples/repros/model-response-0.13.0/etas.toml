[package]
name="response-api"
version="0.1.0"
edition="2026"
[source]
root="src"
[runtime]
default_profile="local"
[runtime.profiles.local.policy]
mode="local-static"
rules=["console=allow","model=allow","tool=allow"]
[runtime.profiles.local.model]
adapter="openai"
model="synthetic"
base_url="http://127.0.0.1:18099/v1"
allow_private=true
typed_output_encoding="output-tool"
[[bin]]
name="response-api"
module="app.main"
flow="main"
